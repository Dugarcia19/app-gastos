<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="App de controle de gastos e entradas com sincronização via CSV">
  <meta name="theme-color" content="#00ff88">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Controle de Gastos">
  <meta name="mobile-web-app-capable" content="yes">
  
  <title>Controle de Gastos - Planilha</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%230f0f0f'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-size='120' fill='%2300ff88' font-family='Arial'%3E📊%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230f0f0f' rx='40'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-size='100' fill='%2300ff88' font-family='Arial'%3E📊%3C/text%3E%3C/svg%3E">
</head>
<body>

<div class="container">
  <h1>📊 Controle Financeiro</h1>

  <div class="resumo">
    <div class="resumo-item">
      <h3>Saldo</h3>
      <span id="saldo" class="valor-destaque">R$ 0,00</span>
    </div>
    <div class="resumo-item entrada">
      <h3>Entradas</h3>
      <span id="entradas">R$ 0,00</span>
    </div>
    <div class="resumo-item saida">
      <h3>Saídas</h3>
      <span id="saidas">R$ 0,00</span>
    </div>
  </div>

  <div class="acoes">
    <form id="form" class="form-inline">
      <input type="text" id="descricao" placeholder="Descrição" required>
      <input type="number" id="valor" placeholder="Valor" min="0.01" step="0.01" required>
      <select id="tipo">
        <option value="entrada">Entrada</option>
        <option value="saida">Saída</option>
      </select>
      <button type="submit">Adicionar</button>
    </form>

    <div class="botoes-extras">
      <button id="exportBtn" class="btn-export">📥 Exportar CSV</button>
      <button id="importBtn" class="btn-import">📤 Importar CSV</button>
      <input type="file" id="fileInput" style="display: none;" accept=".csv">
      <button id="limparBtn" class="btn-limpar">🗑️ Limpar Tudo</button>
    </div>
  </div>

  <div class="tabela-container">
    <table id="tabela" class="tabela-gastos">
      <thead>
        <tr>
          <th>Data</th>
          <th>Descrição</th>
          <th>Tipo</th>
          <th>Valor</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="lista"></tbody>
    </table>
  </div>

  <div id="mensagem" class="mensagem"></div>
</div>

<script src="script.js"></script>

<!-- Registrar Service Worker para PWA -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js')
        .then(registration => {
          console.log('✅ Service Worker registrado com sucesso!');
          
          // Mostrar notificação se for a primeira instalação
          if (registration.active && !registration.installing) {
            const event = new CustomEvent('swReady');
            window.dispatchEvent(event);
          }
        })
        .catch(error => {
          console.log('❌ Erro ao registrar Service Worker:', error);
        });
    });

    // Verificar atualizações
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      window.location.reload();
    });
  }

  // Permitir instalação como app
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    console.log('📱 App pronto para instalar no celular!');
  });

  window.addEventListener('appinstalled', () => {
    console.log('🎉 App instalado com sucesso!');
    deferredPrompt = null;
  });
</script>
</body>
</html>
